name: Locales CI

on:
  pull_request:
    paths:
      - "writing/locales/**"
      - "scripts/validate_locales.py"
      - ".github/workflows/locales-ci.yml"
  push:
    branches:
      - master
    paths:
      - "writing/locales/**"
      - "scripts/validate_locales.py"
      - ".github/workflows/locales-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Validate stylistic locale contracts
        run: python scripts/validate_locales.py
