name: Mind Contract CI

on:
  push:
    branches:
      - master
    paths:
      - manifest.yaml
      - mind-repository.yaml
      - protocol.yaml
      - protocol.lock.yaml
      - conformance.yaml
      - compatibility.yaml
      - schema/**
      - scripts/**
      - "**/module.yaml"
      - "**/identity.yaml"
      - "**/relationships.yaml"
      - docs/migrations/**
      - .github/workflows/manifest-ci.yml
  pull_request:
    paths:
      - manifest.yaml
      - mind-repository.yaml
      - protocol.yaml
      - protocol.lock.yaml
      - conformance.yaml
      - compatibility.yaml
      - schema/**
      - scripts/**
      - "**/module.yaml"
      - "**/identity.yaml"
      - "**/relationships.yaml"
      - docs/migrations/**
      - .github/workflows/manifest-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate mind contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2 jsonschema==4.23.0

      - name: Validate vendored JSON Schemas
        run: python scripts/validate_schemas.py

      - name: Validate manifest YAML syntax
        run: python scripts/validate_manifest.py --syntax-only

      - name: Validate manifest, modules, and resources
        run: python scripts/validate_manifest.py

      - name: Validate universal Identity resource
        run: python scripts/validate_identity_resources.py

      - name: Validate relationship semantics
        run: python scripts/validate_relationships.py

      - name: Validate immutable protocol release lock
        run: python scripts/validate_protocol_lock.py

      - name: Validate personal consumer invariants
        run: python scripts/validate_personal_canary.py
