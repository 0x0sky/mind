name: Mind Contract CI

on:
  push:
    branches:
      - master
    paths:
      - manifest.yaml
      - schema/**
      - scripts/validate_manifest.py
      - scripts/validate_relationships.py
      - "**/module.yaml"
      - identity/identity.yaml
      - relationships/relationships.yaml
      - .github/workflows/manifest-ci.yml
  pull_request:
    paths:
      - manifest.yaml
      - schema/**
      - scripts/validate_manifest.py
      - scripts/validate_relationships.py
      - "**/module.yaml"
      - identity/identity.yaml
      - relationships/relationships.yaml
      - .github/workflows/manifest-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate mind contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2 jsonschema==4.23.0

      - name: Validate manifest YAML syntax
        run: python scripts/validate_manifest.py --syntax-only

      - name: Validate manifest, modules, and resources
        run: python scripts/validate_manifest.py

      - name: Validate relationship semantics and migration
        run: python scripts/validate_relationships.py
