name: Manifest CI

on:
  push:
    branches:
      - master
    paths:
      - manifest.yaml
      - schema/**
      - scripts/validate_manifest.py
      - "**/module.yaml"
      - .github/workflows/manifest-ci.yml
  pull_request:
    paths:
      - manifest.yaml
      - schema/**
      - scripts/validate_manifest.py
      - "**/module.yaml"
      - .github/workflows/manifest-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate manifest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2 jsonschema==4.23.0

      - name: Validate YAML syntax
        run: python scripts/validate_manifest.py --syntax-only

      - name: Validate schema and cross-field rules
        run: python scripts/validate_manifest.py
