name: Mind Contract CI

on:
  pull_request:
    paths:
      - protocol.yaml
      - conformance.yaml
      - compatibility.yaml
      - manifest.yaml
      - schema/**
      - docs/protocol/**
      - scripts/validate_manifest.py
      - scripts/validate_protocol.py
      - scripts/validate_relationships.py
      - scripts/validate_schemas.py
      - scripts/validate_visual_assets.py
      - scripts/validate_identity_resources.py
      - scripts/validate_agent_identity.py
      - scripts/validate_conformance.py
      - scripts/validate_compatibility.py
      - scripts/generate_baseline.py
      - scripts/build_release_bundle.py
      - scripts/migrate_manifest_v2_to_v3.py
      - tests/**
      - "**/module.yaml"
      - identity/identity.yaml
      - relationships/relationships.yaml
      - .github/workflows/manifest-ci.yml
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate mind contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2 jsonschema==4.23.0

      - name: Validate every published JSON Schema
        run: python scripts/validate_schemas.py

      - name: Validate manifest YAML syntax
        run: python scripts/validate_manifest.py --syntax-only

      - name: Validate manifest, modules, and resources
        run: python scripts/validate_manifest.py

      - name: Validate universal Identity resources
        run: python scripts/validate_identity_resources.py

      - name: Validate neutral protocol and instance binding
        run: python scripts/validate_protocol.py

      - name: Validate relationship semantics and migration
        run: python scripts/validate_relationships.py

      - name: Validate canonical visual asset fixtures
        run: python scripts/validate_visual_assets.py

      - name: Validate first-class agent Identity fixture
        run: python scripts/validate_agent_identity.py

      - name: Run dual-mode protocol conformance
        run: python scripts/validate_conformance.py --mode all

      - name: Validate compatibility freeze and migration policy
        run: python scripts/validate_compatibility.py

      - name: Validate reproducible neutral baseline
        run: python scripts/generate_baseline.py --check

      - name: Validate reproducible formal release bundle
        run: python scripts/build_release_bundle.py --check

      - name: Run validator, migration, and release regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
