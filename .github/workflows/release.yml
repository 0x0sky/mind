name: Publish Mind Protocol Release
run-name: Publish Mind Protocol from ${{ github.ref_name }} (${{ inputs.channel }})

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Publication kind
        required: true
        type: choice
        options:
          - release
          - prerelease

permissions:
  contents: write
  actions: read
  pull-requests: read

jobs:
  publish:
    name: Publish verified protocol artifact
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release-packaging dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2 jsonschema==4.23.0

      - name: Derive and verify release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          TARGET_BRANCH: ${{ github.ref_name }}
          TARGET_SHA: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail

          if [[ "$REF_TYPE" != "branch" ]]; then
            echo "formal releases must be dispatched from a branch" >&2
            exit 1
          fi

          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

          DEFAULT_BRANCH="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')"
          if [[ "$TARGET_BRANCH" != "$DEFAULT_BRANCH" ]]; then
            echo "formal protocol releases currently require the default branch: ${DEFAULT_BRANCH}" >&2
            exit 1
          fi

          git fetch origin \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}" \
            --force --depth=1
          REMOTE_SHA="$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")"
          if [[ "$REMOTE_SHA" != "$TARGET_SHA" ]]; then
            echo "selected branch moved after dispatch; run the workflow again" >&2
            exit 1
          fi

          VERSION="$(python - <<'PY'
          import yaml
          with open('protocol.yaml', encoding='utf-8') as handle:
              print(yaml.safe_load(handle)['protocol']['version'])
          PY
          )"

          test -n "$VERSION"
          test -f "docs/protocol/releases/v${VERSION}.md"

          case "$CHANNEL" in
            release)
              if [[ "$VERSION" == *-* ]]; then
                echo "release requires a stable semantic version; protocol.yaml contains ${VERSION}" >&2
                exit 1
              fi
              ;;
            prerelease)
              if [[ "$VERSION" != *-* ]]; then
                echo "prerelease requires a prerelease semantic version; protocol.yaml contains ${VERSION}" >&2
                exit 1
              fi
              ;;
            *)
              echo "unsupported publication kind: ${CHANNEL}" >&2
              exit 1
              ;;
          esac

          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "tag v${VERSION} already exists; release tags are immutable" >&2
            exit 1
          fi

          {
            echo "VERSION=${VERSION}"
            echo "TARGET_BRANCH=${TARGET_BRANCH}"
            echo "TARGET_SHA=${TARGET_SHA}"
            echo "CHANNEL=${CHANNEL}"
          } >> "$GITHUB_ENV"

          echo "release target: ${TARGET_BRANCH}@${TARGET_SHA} -> v${VERSION} (${CHANNEL})"

      - name: Verify target tree came from green pull request CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          PR_NUMBER="$(
            gh api "repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/pulls" \
              --jq "[.[] | select(.merged_at != null and .base.ref == \"${TARGET_BRANCH}\")] | first | .number"
          )"
          if [[ -z "$PR_NUMBER" || "$PR_NUMBER" == "null" ]]; then
            echo "release target is not associated with a merged pull request into ${TARGET_BRANCH}" >&2
            exit 1
          fi

          PR_MERGE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.merge_commit_sha')"
          if [[ "$PR_MERGE_SHA" != "$TARGET_SHA" ]]; then
            echo "release target is not the selected pull request merge commit" >&2
            exit 1
          fi

          PR_HEAD_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          git fetch origin "$PR_HEAD_SHA" --depth=1

          TARGET_TREE="$(git rev-parse "${TARGET_SHA}^{tree}")"
          TESTED_TREE="$(git rev-parse "${PR_HEAD_SHA}^{tree}")"
          if [[ "$TARGET_TREE" != "$TESTED_TREE" ]]; then
            echo "release tree differs from the pull-request head that was tested" >&2
            exit 1
          fi

          RUN_ID="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/manifest-ci.yml/runs?head_sha=${PR_HEAD_SHA}&event=pull_request&status=completed&per_page=50" \
              --jq '[.workflow_runs[] | select(.conclusion == "success")] | first | .id'
          )"
          if [[ -z "$RUN_ID" || "$RUN_ID" == "null" ]]; then
            echo "no successful Mind Contract CI run found for tested pull-request head" >&2
            exit 1
          fi

          echo "release evidence: PR #${PR_NUMBER}, tested head ${PR_HEAD_SHA}, CI run ${RUN_ID}, tree ${TARGET_TREE}"

      - name: Build deterministic release artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          python scripts/build_release_bundle.py \
            --version "$VERSION" \
            --output "dist/mind-protocol-v${VERSION}.zip" \
            --sha256-output "dist/mind-protocol-v${VERSION}.sha256"

      - name: Publish GitHub Release and immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          args=(
            "v${VERSION}"
            "dist/mind-protocol-v${VERSION}.zip"
            "dist/mind-protocol-v${VERSION}.sha256"
            --target "$TARGET_SHA"
            --title "Mind Protocol ${VERSION}"
            --notes-file "docs/protocol/releases/v${VERSION}.md"
          )

          if [[ "$CHANNEL" == "prerelease" ]]; then
            args+=(--prerelease)
          fi

          gh release create "${args[@]}"

      - name: Verify published release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release view "v${VERSION}" --json tagName,isPrerelease,url > release.json
          python - <<'PY'
          import json
          import os

          data = json.load(open('release.json', encoding='utf-8'))
          expected_prerelease = os.environ['CHANNEL'] == 'prerelease'
          if data['tagName'] != f"v{os.environ['VERSION']}":
              raise SystemExit('published tag name does not match protocol version')
          if data['isPrerelease'] is not expected_prerelease:
              raise SystemExit('published prerelease state does not match selected publication kind')
          print(data['url'])
          PY

          git fetch origin "refs/tags/v${VERSION}:refs/tags/v${VERSION}" --force
          PUBLISHED_SHA="$(git rev-list -n 1 "v${VERSION}")"
          if [[ "$PUBLISHED_SHA" != "$TARGET_SHA" ]]; then
            echo "published tag does not point to the verified release commit" >&2
            exit 1
          fi
