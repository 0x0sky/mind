# Version of the concrete mind manifest shape. Mind Protocol 0.6 continues to use manifest schema version 2.
schema_version: 2

# Shared protocol semantics are declared independently in protocol.yaml.
protocol:
  id: mind
  version: 0.6.0

# This root manifest is the living concrete instance on master: mind@0x0sky.
mind:
  name: mind@0x0sky
  # Compatibility classification retained for current consumers during the 0.x migration.
  kind: personal
  # Semantic version of the durable context published by this concrete instance.
  context_version: 0.4.0
  subject:
    type: person
    id: 0x0sky
  owner:
    type: person
    id: 0x0sky

# Legacy GitHub-oriented compatibility projection. Values here are provider
# logins, not canonical organization ids. Canonical relationship identity lives
# in relationships/relationships.yaml.
public_organizations:
  - aiaiaiai-org
  - 0xda-market
  - nilx-one

contract:
  canonical_source: required
  explicit_subject: required
  explicit_owner: required
  versioned_context: required
  human_readable: required
  machine_readable: required
  secrets: forbidden

modules:
  required:
    - identity
  registered:
    - identity
    - relationships
    - knowledge
    - engineering
    - systems
    - writing
  rules:
    single_responsibility: required
    explicit_dependencies: required
    independently_replaceable: required
    duplicate_content: forbidden
    cross_reference: preferred
    composition_over_inheritance: preferred
  catalog:
    identity: identity/module.yaml
    relationships: relationships/module.yaml
    knowledge: knowledge/module.yaml
    engineering: engineering/module.yaml
    systems: systems/module.yaml
    writing: writing/module.yaml

context:
  stability:
    stable: long_lived_contracts
    transient: current_state
    archived: ignored_unless_requested
  visibility:
    repository: public
    allowed: durable_public_context
    forbidden:
      - credentials
      - secrets
      - private_health_data
      - private_relationship_data
      - transient_personal_state

loading:
  default:
    - identity
    - relationships
    - knowledge
    - engineering
    - systems
  optional:
    - writing

validation:
  schema: schema/mind.schema.json
  module_schema: schema/module.schema.json
