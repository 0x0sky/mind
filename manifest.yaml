version: 1

repository:
  name: mind
  description: Vendor-independent context repository
  foundation: true

structure:
  assistant:
    path: .assistant
    description: Vendor-independent assistant configuration
    priority: high

  identity:
    description: Stable identity of the repository owner
    priority: medium

  knowledge:
    description: Durable domain knowledge
    priority: medium

  systems:
    description: Reusable systems and specifications
    priority: high

  projects:
    description: Self-contained project context
    priority: highest

  state:
    description: Current priorities and active context
    priority: highest

  archive:
    description: Historical information
    priority: ignore_unless_requested

rules:
  single_source_of_truth: true
  duplicate_content: forbidden
  cross_reference: preferred
  canonical_files: required
  stable_and_temporary_context_separated: true
  assistant_and_implementation_separated: true
  secrets_forbidden: true

formats:
  knowledge: markdown
  machine_readable_configuration: yaml

loading:
  default:
    - state
    - projects
    - systems
    - .assistant

  extended:
    - knowledge
    - identity

  full:
    - archive

derivation:
  personal_and_organization_histories: independent
  upstream_synchronization: optional
