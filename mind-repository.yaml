schema_version: 1
scope: repository_metadata
protocol_contract: false

repository:
  id: 0x0sky/mind
  default_branch: master
  roles:
    protocol_authority:
      enabled: false
    concrete_mind:
      enabled: true
      entrypoint: manifest.yaml
      canonical_for_subject:
        type: person
        id: 0x0sky
      reference_implementation: false
      template_authority: false

routing:
  concrete_instance: manifest.yaml
  protocol_lock: protocol.lock.yaml
  identity: modules/identity/module.yaml

protocol_consumption:
  id: mind
  version: 0.9.0
  authority_repository: aiaiaiai-org/mind-protocol
  release_repository: 0x0sky/mind
  release_tag: v0.9.0
  release_commit: 457844c8ced0318d91d628617ff6f8ec6f428ab7
  floating_master: forbidden

fork_policy:
  relationship_to_protocol_repository: independent_consumer
  copy_reference_instance_content: forbidden
  creation_mechanism: exact_release_bootstrap

version_axes:
  protocol_version: external_release
  context_version: independent_concrete_publication

invariants:
  - this_repository_is_not_mind_protocol_authority
  - mind_at_0x0sky_is_canonical_only_for_person_0x0sky
  - current_protocol_authority_is_aiaiaiai_org_mind_protocol
  - historical_release_provenance_is_preserved_exactly
  - provider_accounts_do_not_define_canonical_identity
  - protocol_tags_are_forbidden_as_concrete_context_tags
