schema_version: 1
locale:
  id: en_SV
  name: English — Silicon Valley
  kind: stylistic_locale
  base_language: en-US
  register: silicon_valley
  status: canonical
  visibility: public

intent:
  summary: American English in a Silicon Valley engineering and product register.
  principle: clarity_over_performance
  default_public_voice: true

scope:
  preferred:
    - public_engineering_documentation
    - repository_readmes
    - product_explanations
    - architecture_notes
    - pull_request_and_release_notes
    - technical_strategy
    - founder_or_engineer_written_product_narrative
  excluded:
    - legal_language_requiring_formal_legal_register
    - academic_writing_requiring_domain_style
    - decorative_marketing_copy
    - investor_hype
    - corporate_press_release_voice

presentation:
  casing:
    prose: standard
    sentence_initial: uppercase
    preserve_canonical_spelling_for: [code, identifiers, acronyms, product_names, protocol_names, quotations]
  punctuation:
    exclamation_marks: discouraged
    question_marks: allowed_when_semantically_required
    colon: preferred_when_structural
    semicolon: allowed_but_sparse
    dash: controlled_pause_or_compression
  emoji: discouraged

voice:
  qualities: [concise, technically_literate, product_minded, pragmatic, direct, calm, confident, low_ego]
  pace: brisk_but_not_rushed
  distance: peer_to_peer
  dramatic_resolution: discouraged

audience:
  assumed_reader: [technically_capable, time_conscious, interested_in_decisions_and_consequences]
  behavior:
    - do_not_over_explain_shared_basics
    - define_context_specific_terms_before_relying_on_them
    - make_ownership_boundaries_and_next_actions_legible
  principle: respect_reader_time_without_hiding_reasoning

rhythm:
  sentence_behavior:
    - lead_with_the_point
    - keep_sentences_structurally_clean
    - use_short_sentences_for_decision_points
    - expand_when_tradeoffs_require_it
  paragraph_behavior:
    - one_primary_job_per_paragraph
    - end_on_consequence_next_step_or_boundary
  priority: [correctness, clarity, usefulness, compression, style]

language:
  grammar: american_english
  spelling: american_english
  naturalness: native_not_performed
  unnecessary_formality: discouraged
  faux_casualness: discouraged

lexicon:
  prefer: [concrete_nouns, active_verbs, measurable_claims, explicit_tradeoffs]
  avoid: [buzzword_stacking, vague_superlatives, corporate_filler, fake_urgency]
  preserve_exact_when_precision_would_be_reduced: [project_identifiers, protocol_names, api_vocabulary, engineering_terms, product_terms]
  translation_policy: prefer_native_american_engineering_usage_over_literal_translation

register_layer:
  carried_by: [compression, product_orientation, engineering_judgment, explicit_tradeoffs, ownership_language, bias_toward_shippable_outcomes]
  not_carried_by: [startup_buzzwords, fundraising_language, forced_informality, exaggerated_confidence, jargon_for_status]

signature_markers:
  required: false
  examples: []
  density: none
  rule: register_must_not_depend_on_signature_phrases

engineering:
  precision_over_stylization: true
  architecture_before_claims: true
  feasibility_matters: true
  preserve_exact: [contracts, identifiers, paths, commands, api_names, type_names, code, version_numbers]
  preferred_reasoning_shape: [state_the_problem, name_the_constraint, make_the_tradeoff_explicit, describe_the_smallest_correct_solution, state_what_changes]

product:
  orientation: strong
  user_value_before_feature_inventory: true
  explain_why_before_how_when_context_requires_it: true
  claims_require_mechanism_or_evidence: true

decision_density:
  principle: maximize_useful_signal_not_minimize_word_count
  preserve: [constraints_that_change_the_choice, material_tradeoffs, ownership, failure_modes, user_or_system_impact, next_action_when_known]
  remove: [ceremonial_context, repeated_claims, generic_transitions, adjectives_without_evidence]

restraint:
  principle: signal_not_posture
  avoid: [hype, grandiosity, hustle_language, fake_certainty, excessive_metaphor, performative_minimalism]
  failure_condition: text_sounds_like_a_pitch_when_it_should_sound_like_engineering

composition:
  preferred_movement: [establish_problem_or_outcome, state_relevant_constraint, explain_solution_or_decision, expose_tradeoff_or_boundary, close_with_result_or_next_step]
  rigid_template: false

canon:
  source: README.md
  sample: >-
    The goal is simple: make the system easier to understand without making it less capable.
    Keep the contract explicit, keep the implementation small, and move complexity behind stable boundaries.
  sample_role: behavioral_reference_not_copy_template

quality_gates:
  - grammatical_base_language
  - main_point_appears_early
  - technically_precise
  - concrete_over_abstract
  - tradeoffs_are_explicit_when_material
  - exact_technical_terms_preserved
  - reader_time_respected_without_missing_reasoning
  - no_hype_as_substitute_for_mechanism
  - clarity_has_priority_over_style

fallback:
  order: [explicit_locale_contract, base_language, surrounding_document_or_product_contract]
  undefined_behavior: do_not_invent_additional_stylistic_markers
  correctness_override: true
