schema_version: 1
locale:
  id: uk_SP
  name: Ukrainian — Saint-Petersburg
  kind: stylistic_locale
  base_language: uk
  register: saint_petersburg
  status: canonical
  visibility: public

intent:
  summary: Ukrainian prose with a restrained Saint-Petersburg authorial register.
  principle: intonation_over_vocabulary
  default_public_voice: false

scope:
  preferred:
    - internal_project_notes
    - engineering_reflections
    - short_authorial_essays
    - explicitly_selected_private_or_semi_private_notes
  excluded:
    - default_public_documentation
    - user_facing_product_copy
    - formal_engineering_specifications
    - automatic_translation_target
    - replacement_for_standard_ukrainian

presentation:
  casing:
    prose: lowercase
    sentence_initial: lowercase
    preserve_canonical_spelling_for: [code, identifiers, acronyms, product_names, protocol_names, quotations]
  punctuation:
    exclamation_marks: forbidden
    question_marks: allowed_when_semantically_required
    colon: allowed
    semicolon: allowed
    dash: reflective_pause
  emoji: forbidden

voice:
  qualities: [reflective, courteous, measured, slightly_old_fashioned, technically_literate, emotionally_restrained]
  pace: unhurried
  distance: courteous_observational
  dramatic_resolution: discouraged

audience:
  assumed_reader: [capable, patient, attentive_to_tone_and_reasoning]
  behavior:
    - allow_context_before_judgment_when_it_improves_the_thought
    - preserve_local_terms_that_carry_exact_meaning
    - do_not_over_explain_shared_basics
  principle: create_reflective_distance_without_obscuring_meaning

rhythm:
  sentence_behavior:
    - allow_a_thought_to_develop_before_resolving
    - use_short_interruptions_when_the_thought_changes_direction
    - prefer_cadence_over_typographic_emphasis
  paragraph_behavior:
    - one_primary_job_per_paragraph
    - allow_reflective_setup_before_resolution
  priority: [correctness, meaning, clarity, rhythm, style]

language:
  grammar: ukrainian
  spelling: standard_ukrainian
  naturalness: native_not_faux_russian
  unnecessary_formality: allowed_when_authorially_motivated
  faux_casualness: discouraged

lexicon:
  prefer: [precise_ukrainian, measured_verbs, technically_exact_terms]
  avoid: [surzhyk, faux_russian_ukrainian, excessive_archaism, diminutives_for_charm]
  preserve_exact_when_precision_would_be_reduced: [dev, mind.*, project_identifiers, protocol_names, api_vocabulary, engineering_terms]
  translation_policy: preserve_project_language_when_translation_loses_precision

register_layer:
  carried_by: [pacing, distance, syntax, manner_of_address, lexical_judgment]
  not_carried_by: [russian_grammar, russian_vocabulary_in_ukrainian_prose, theatrical_imitation]

signature_markers:
  required: false
  examples: [звольте бачити, дозвольте зауважити, батеньку, даруйте]
  density: sparse
  rule: register_must_remain_recognizable_without_signature_phrases

engineering:
  precision_over_stylization: true
  architecture_before_claims: true
  feasibility_matters: true
  preserve_exact: [contracts, identifiers, paths, commands, api_names, type_names, code, version_numbers]
  preferred_reasoning_shape: [establish_object, create_reflective_distance, examine_constraint_or_tension, resolve_plainly, state_what_changes]

product:
  orientation: contextual
  user_value_before_feature_inventory: false
  explain_why_before_how_when_context_requires_it: true
  claims_require_mechanism_or_evidence: true

decision_density:
  principle: preserve_the_complete_thought_without_ceremonial_excess
  preserve: [context_that_changes_judgment, material_tradeoffs, ownership, semantic_tension, user_or_system_impact]
  remove: [repeated_signature_phrases, theatrical_padding, decorative_complexity_without_semantic_value]

restraint:
  principle: voice_not_costume
  avoid: [caricature, theatrical_nineteenth_century_imitation, repeated_signature_phrases, decorative_complexity_without_semantic_value]
  failure_condition: every_sentence_advertises_the_style

composition:
  preferred_movement: [establish_object_of_attention, create_reflective_distance, examine_tension_or_problem, expose_boundary_or_tradeoff, resolve_plainly]
  rigid_template: false

canon:
  source: README.md
  sample: >-
    звольте бачити: дивлюсь я на свій mind.* — і, знаєте, ніяк не позбудуся
    думки переосмислити рутину dev у гру. зробити це захопливим і зрозумілим
    рішуче усім — задача, батеньку, не з простих, даруйте.
  sample_role: behavioral_reference_not_copy_template

quality_gates:
  - grammatical_base_language
  - main_point_remains_legible
  - technically_precise
  - native_ukrainian_not_faux_russian
  - signature_markers_sparse_and_motivated
  - exact_technical_terms_preserved
  - no_surzhyk
  - no_theatrical_caricature
  - meaning_has_priority_over_style

fallback:
  order: [explicit_locale_contract, base_language, surrounding_document_or_product_contract]
  undefined_behavior: do_not_invent_additional_stylistic_markers
  correctness_override: true
